<!DOCTYPE html>

<title data-page-node-id="8HJLnlnPRun8jcJfA4lrBN" data-pnid-children="FZQXulm1BQ29WZbaDZTmUy">补货工作台 · 原型</title>

/* ============================================================
   设计变量（迭代改这里：颜色 / 圆角 / 字号）
   ============================================================ */
:root{
  --bg:#f5f6f8; --panel:#ffffff; --line:#e6e8ec; --line-2:#d3d7de;
  --text:#1d2129; --text-2:#4e5560; --text-3:#86909c;
  --brand:#5261d8; --brand-2:#6b78e8; --brand-weak:#eef0fd; --brand-line:#c6ccf4;
  --red:#d83931;   --red-weak:#fdeceb;   /* 缺口 / 驳回 / 失败 */
  --green:#1f9d55; --green-weak:#e9f8ef; /* 冗余 / 成功 / 放行 */
  --amber:#b26a00; --amber-weak:#fdf3e3; /* 待处理 / 进行中 */
  --blue:#1677b8;  --blue-weak:#e8f3fb;  /* 信息 / 快照 */
  --gray-weak:#f2f3f5;
  --r:8px; --r-s:6px;
  --shadow:0 1px 2px rgba(29,33,41,.05),0 1px 6px rgba(29,33,41,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}

/* ============================================================
   布局骨架
   ============================================================ */
#app{display:none;grid-template-rows:52px 1fr;grid-template-columns:212px 1fr;height:100vh}
#app.on{display:grid}
header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.brand .logo{width:22px;height:22px;border-radius:6px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.hdr-chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border:1px solid var(--line);border-radius:var(--r-s);font-size:12px;color:var(--text-2);background:#fafbfc}
.hdr-chip b{color:var(--text);font-weight:600}
.hdr-sp{flex:1}
.hdr-user{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2)}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--brand-weak);color:var(--brand);display:grid;place-items:center;font-size:11px;font-weight:600}

aside{background:var(--panel);border-right:1px solid var(--line);padding:10px 8px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-s);color:var(--text-2);font-size:13.5px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.nav-item:hover{background:var(--gray-weak);color:var(--text);text-decoration:none}
.nav-item.on{background:var(--brand-weak);color:var(--brand);font-weight:600;border-color:var(--brand-line)}
.nav-item svg{flex:none}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;line-height:1;padding:3px 6px;border-radius:9px;font-weight:600}
.nav-sec{font-size:11px;color:var(--text-3);padding:12px 10px 4px}

main{overflow-y:auto;padding:18px 22px 40px}
.page{max-width:1480px;margin:0 auto}

/* ============================================================
   通用组件
   ============================================================ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px}
.card-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px}
.card-h .sub{font-weight:400;font-size:12px;color:var(--text-3)}
.card-h .sp{flex:1}
.card-b{padding:12px 14px}
.card-b.tight{padding:0}

.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:var(--r-s);border:1px solid var(--line-2);background:#fff;color:var(--text-2);font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-2)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.link{border:none;background:none;padding:0 4px;color:var(--brand);height:auto}
.btn[disabled]{opacity:.45;pointer-events:none}

.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:4px;font-size:12px;line-height:1;white-space:nowrap}
.tag.red{background:var(--red-weak);color:var(--red)}
.tag.green{background:var(--green-weak);color:var(--green)}
.tag.amber{background:var(--amber-weak);color:var(--amber)}
.tag.blue{background:var(--blue-weak);color:var(--blue)}
.tag.gray{background:var(--gray-weak);color:var(--text-2)}
.tag.brand{background:var(--brand-weak);color:var(--brand)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .t{font-size:12px;color:var(--text-3);margin-bottom:5px}
.kpi .v{font-size:21px;font-weight:650;letter-spacing:.2px}
.kpi .v small{font-size:12px;font-weight:400;color:var(--text-3);margin-left:3px}
.kpi .m{font-size:12px;color:var(--text-3);margin-top:4px}
.kpi .m .up{color:var(--red);font-weight:600}
.kpi .m .down{color:var(--green);font-weight:600}
/* —— 工作台统计报表：迷你趋势图 —— */
.stat-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.stat-charts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.mchart{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px 10px}
.mchart .t{font-size:13px;font-weight:650;display:flex;align-items:baseline;gap:8px}
.mchart .t .muted{font-weight:400;font-size:11.5px}
.mchart .t .val{margin-left:auto;font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
.mchart svg{width:100%;height:120px;display:block;margin-top:6px}
.mchart .lg{display:flex;gap:12px;font-size:11px;color:var(--text-3);margin-top:2px}
.mchart .lg .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
@media (max-width:1200px){ .stat-charts{grid-template-columns:1fr} .stat-kpis{grid-template-columns:repeat(2,1fr)} }

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2>.card{margin-bottom:0}
/* 参数配置：tab 切换布局 + 统一输入格与面板脚注 */
.cfg-tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);overflow-x:auto}
.cfg-tab{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border:none;background:none;color:var(--text-2);font-size:13px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit}
.cfg-tab:hover{color:var(--brand)}
.cfg-tab.on{color:var(--brand);font-weight:600;border-bottom-color:var(--brand)}
.cfg-tab.on .cfg-no{background:var(--brand);color:#fff}
.cfg-tab .cfg-no{width:18px;height:18px;border-radius:5px;font-size:11px}
.cfg-no{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:var(--brand-weak,#eef0fb);color:var(--brand);font-size:11px;font-weight:700;flex:none}
.cfg-sub{padding:10px 14px 0;font-size:12px;color:var(--text-3)}
.cfg-bar{display:flex;align-items:center;gap:10px;padding:10px 14px}
.cfg-in{width:38px;border:1px solid transparent;border-radius:4px;text-align:right;font-size:12.5px;padding:2px;font-family:inherit;background:transparent}
.cfg-in:hover{border-color:var(--line)}
.cfg-in:focus{outline:none;border-color:var(--brand)}
.cfg-ft{border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;padding-top:10px}
.cfg-ft>span,.cfg-ft>a{font-size:12px;color:var(--text-3)}
.cfg-sel{height:26px;border:1px solid var(--line-2);border-radius:6px;font-size:12.5px;padding:0 6px;background:#fff}

table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{background:#fafbfc;color:var(--text-2);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
.tb td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tb tr:last-child td{border-bottom:none}
.tb tbody tr:hover{background:#fafbff}
.tb .num{font-variant-numeric:tabular-nums;text-align:right}
.tb .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px}
.tb td.wrap{white-space:normal}
.tb td.sku-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* SKU 明细表列多，单独收窄内边距，保证 1440 屏下「采购量 Q」不被挤出可视区 */
.tb.sku th,.tb.sku td{padding:8px 5px}
.tb.sku td.sku-title{max-width:170px}
.tb.sku th.ck,.tb.sku td.ck{width:30px;padding-left:10px}
.gap{color:var(--red);font-weight:600}
.over{color:var(--green);font-weight:600}
.muted{color:var(--text-3)}
.row-btn{cursor:pointer}
.row-btn:hover{color:var(--brand);text-decoration:underline}

.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.fbar select,.fbar input{height:28px;border:1px solid var(--line-2);border-radius:var(--r-s);padding:0 8px;font-size:12.5px;background:#fff;color:var(--text);min-width:96px}
.fbar input{min-width:150px}
.fbar .lab{font-size:12px;color:var(--text-3)}

.seg{display:inline-flex;background:var(--gray-weak);border-radius:var(--r-s);padding:2px;gap:2px}
.seg button{border:none;background:none;padding:4px 12px;font-size:12.5px;border-radius:5px;cursor:pointer;color:var(--text-2)}
.seg button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(29,33,41,.1)}
.seg button[disabled]{opacity:.4;pointer-events:none}

.sumbar{display:flex;gap:18px;padding:9px 14px;background:#fafbfc;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--text-2)}
.sumbar b{color:var(--text)}

/* 批量操作条：两行布局，勾选区一行 / 计数+动作一行，避免横向溢出把按钮挤出可视区 */
.batchbar{display:flex;flex-direction:column;gap:6px;padding:9px 14px;background:var(--brand-weak);border-bottom:1px solid var(--brand-line);font-size:12.5px;color:var(--text-2)}
.batchbar .brow1{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.batchbar .brow1 > *{flex:none}
.batchbar .brow2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end}
.batchbar .brow2 > *{flex:none}
.batchbar .lab{font-size:12px;color:var(--brand);font-weight:600}
.batchbar .cnt{color:var(--text);font-weight:600}
.batchbar .btn:not(.primary):not(.link){background:#fff}
.bhint{font-size:12px;color:var(--text-3);flex:none}
.brow-sel{background:var(--brand-weak) !important}
.brow-sel td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
.bopt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bopt label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);border:1px solid var(--line);border-radius:var(--r-s);padding:6px 10px;cursor:pointer;background:#fff}
.bopt label.on{border-color:var(--brand);background:var(--brand-weak);color:var(--brand)}
.bopt input{margin:0}
.bprev{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-s)}

.steps{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.step{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;position:relative}
.step .n{width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;display:grid;place-items:center;font-weight:600;margin-bottom:7px}
.step .t{font-weight:600;font-size:13px;margin-bottom:3px}
.step .d{font-size:12px;color:var(--text-3);line-height:1.55}
.step .go{margin-top:7px;font-size:12px}
.step-arrow{display:grid;place-items:center;padding:0 6px;color:var(--text-3);flex:none}

.note{display:flex;gap:8px;padding:9px 12px;border-radius:var(--r-s);font-size:12.5px;line-height:1.6;margin-bottom:12px}
.note.info{background:var(--blue-weak);color:#0b4a75}
.note.warn{background:var(--amber-weak);color:#7a4c00}
.note .ic{flex:none;font-weight:700}

.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px}
.chain .node{background:var(--gray-weak);border:1px solid var(--line);border-radius:var(--r-s);padding:3px 9px}
.chain .node b{font-variant-numeric:tabular-nums}
.chain .node.manual{background:var(--brand-weak);border-color:var(--brand-line);color:var(--brand);font-weight:600}
.chain .arr{color:var(--text-3)}
.chain .fix.plus{color:var(--red)}
.chain .fix.minus{color:var(--green)}

.drawer-row td{background:#fafbfd;padding:12px 14px}
.drawer-row .blk{margin-bottom:10px}
.drawer-row .blk:last-child{margin-bottom:0}
.drawer-row .bt{font-size:12px;color:var(--text-3);margin-bottom:5px;font-weight:600}

.iz{display:flex;align-items:center;gap:0;margin-bottom:14px}
.iz .it{flex:1;display:flex;align-items:center;gap:8px}
.iz .num{width:22px;height:22px;border-radius:50%;background:var(--gray-weak);color:var(--text-3);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.iz .it.on .num{background:var(--brand);color:#fff}
.iz .it.done .num{background:var(--green);color:#fff}
.iz .tt{font-size:13px;color:var(--text-3)}
.iz .it.on .tt{color:var(--text);font-weight:600}
.iz .it.done .tt{color:var(--green)}
.iz .bar{flex:1;height:2px;background:var(--line);margin:0 10px}
.iz .it.done+.bar,.iz .bar.done{background:var(--green)}

.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:26px;text-align:center;color:var(--text-3);font-size:13px;cursor:pointer;background:#fafbfc}
.drop:hover{border-color:var(--brand);color:var(--brand)}
.drop .f{margin-top:6px;color:var(--text);font-weight:600}

.tcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tcard{border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;background:#fff}
.tcard:hover{border-color:var(--brand-line)}
.tcard.on{border-color:var(--brand);background:var(--brand-weak)}
.tcard .t{font-weight:600;font-size:13.5px;margin-bottom:3px}
.tcard .d{font-size:12px;color:var(--text-3);line-height:1.55}

/* 弹层 / 提示 */
#mask{position:fixed;inset:0;background:rgba(29,33,41,.45);display:none;place-items:center;z-index:50;padding:20px}
#mask.on{display:grid}
.modal{background:#fff;border-radius:10px;width:520px;max-width:96vw;max-height:88vh;overflow:auto;box-shadow:0 8px 30px rgba(29,33,41,.18)}
.modal-h{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
.modal-h .x{margin-left:auto;border:none;background:none;font-size:16px;color:var(--text-3);cursor:pointer;padding:0 4px}
.modal-b{padding:14px 16px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.frm{display:grid;grid-template-columns:110px 1fr;gap:9px 12px;align-items:center;font-size:13px}
.frm input,.frm select,.frm textarea{width:100%;border:1px solid var(--line-2);border-radius:var(--r-s);padding:5px 8px;font-size:13px;font-family:inherit}
.frm textarea{resize:vertical;min-height:56px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:300}
.toast{background:#fff;border:1px solid var(--line);border-left:3px solid var(--green);border-radius:var(--r-s);box-shadow:0 4px 16px rgba(29,33,41,.12);padding:9px 14px;font-size:13px;animation:tin .18s ease}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}

/* 访问密码门 */

.ph{color:var(--text-3);font-size:13px;padding:22px;text-align:center}
.pimg{display:inline-grid;place-items:center;border-radius:6px;border:1px solid rgba(0,0,0,.08);font-weight:600;flex:none;vertical-align:middle;user-select:none;box-shadow:inset 0 -8px 12px rgba(0,0,0,.07)}
.footer-note{color:var(--text-3);font-size:12px;text-align:center;padding:18px 0 4px}

/* ============================================================
   补货看板（宽幅弹层）
   ============================================================ */
.modal.wide{width:min(1280px,96vw)}
.bd-head{display:flex;gap:14px;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.bd-head .t{font-size:16px;font-weight:650;display:flex;align-items:center;gap:8px}
.bd-head .s{font-size:12px;color:var(--text-3);margin-top:3px}
.bd-chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto;justify-content:flex-end}
.bd-sum{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px}
.bd-sum .c{background:#fafbfc;border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px}
.bd-sum .c .k{font-size:11.5px;color:var(--text-3)}
.bd-sum .c .v{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.bd-sum .c .v small{font-size:11.5px;font-weight:400;color:var(--text-3);margin-left:2px}
.bd-step{border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;background:#fff}
.bd-step>.sh{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fafbfc;border-bottom:1px solid var(--line);font-weight:650;font-size:13.5px}
.bd-step>.sh .n{width:20px;height:20px;border-radius:5px;background:var(--brand);color:#fff;font-size:11.5px;display:grid;place-items:center;font-weight:700;flex:none}
.bd-step>.sh .sp{flex:1}
.bd-step>.sb{padding:10px 12px}
.bd-step>.sb.tight{padding:0}
.bd-eq{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;line-height:1.9;background:#fafbfc;border:1px solid var(--line);border-radius:var(--r-s);padding:8px 11px;white-space:pre-wrap;word-break:break-word}
.bd-eq b{color:var(--brand);font-weight:700}
.bd-eq .hl{color:var(--red);font-weight:600}
.bd-formula{font-size:12.5px;color:var(--text-2);line-height:1.75;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
.bd-formula code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--gray-weak);border-radius:4px;padding:1px 5px;font-size:12px;color:var(--text)}
.bd-in{display:inline-flex;align-items:baseline;gap:5px}
.bd-in .lbl{font-size:12px;color:var(--text-3)}
.bd-in .v{font-weight:650;font-variant-numeric:tabular-nums}
.bd-in .u{font-size:11.5px;color:var(--text-3)}
.bd-hit{background:var(--brand-weak)!important;box-shadow:inset 3px 0 0 var(--brand)}
.bd-hit td{font-weight:600}
.bd-tag-s{font-size:11px;color:var(--brand);background:var(--brand-weak);border-radius:4px;padding:1px 5px;margin-left:5px}
.tb .sub2{font-size:11.5px;color:var(--text-3)}

const FINANCE_GRADES=['S','A','B','C','D','E'];
function ratingNorm(v){return String(v||'').trim().toUpperCase()}
function financeOptions(value){return '<option value="">未填写</option>'+FINANCE_GRADES.map(g=>`<option value="${g}" ${ratingNorm(value)===g?'selected':''}>${g}</option>`).join('')}
function financeCompare(p){const a=ratingNorm(p.owner),b=ratingNorm(p.financeRating);if(!a||!b)return '<span class="muted">'+(!a&&!b?'两项待补充':!a?'运营评级待补充':'财务评级待补充')+'</span>';if(a===b)return '<span class="tag green">评级一致 · '+esc(a)+'</span>';return '<span class="tag amber">评级不一致</span><span style="display:block;color:var(--amber)">运营 '+esc(a)+' / 财务 '+esc(b)+'</span>'}
function financeSummary(list){const valid=list.filter(p=>ratingNorm(p.owner)&&ratingNorm(p.financeRating)),diff=valid.filter(p=>ratingNorm(p.owner)!==ratingNorm(p.financeRating)).length;return ` · 当前列表：${diff} 款不一致，${valid.length-diff} 款一致，${list.length-valid.length} 款待补充。`}

/* monthDays 动态推导：当月剩余天数 + 后 4 个月实有天数（从数据日算起，不再硬编码） */
function calcMonthDays(dataDate){
  const d=new Date(dataDate); const out=[];
  let y=d.getFullYear(), m=d.getMonth();
  const dim=[31,28,31,30,31,30,31,31,30,31,30,31];
  const dimOf=(yy,mm)=>{ if(mm===1&&((yy%4===0&&yy%100!==0)||yy%400===0)) return 29; return dim[mm]; };
  out.push(dimOf(y,m)-d.getDate());           // 当月剩余
  for(let i=1;i<=4;i++){ const nm=(m+i)%12, ny=y+Math.floor((m+i)/12); out.push(dimOf(ny,nm)); }
  return out;
}

/* 价格阶梯（替代式，Step3③）：店长 S 视同 A/B/C；D/E 不走专属阶梯
   —— v0.2 新增三条例外（源：判定条件完善.docx）——
   ①新品通道：上架≤2个月/未开售 → 不走价格评级阶梯（目标价按溯源订单退货率核定，人工评审天数）
   ②低单价观察期：目标价<$20，第1-5月观察；第4-5月过渡期"不采购"阈值 80%→70%；月销>50 提示例外审批
   ③财务季节调整：7/8月秋冬推广期价格评级D/E正常采；10月前AB级<70%可采（A封顶75/B封顶65）；夏款12-1月同理 */
function ladderRule(owner, tier, ratio, ctx){
  if(ratio==null) return {type:'skip',text:'价格缺失或比例缺失 → 跳过阶梯（人工判断，同采购计算表"/"口径）'};
  ctx = ctx || {};
  const mon = ctx.month;                                  // 数据日月份（1-12）
  /* ① 新品通道：上架≤2个月 → 不套价格阶梯 */
  if(ctx.isNew90) return {type:'none',isNew:true,text:'上架≤2个月新品 → 溯源退货率核定目标价，人工评审天数'};
  /* ② 低单价观察期 */
  if(ctx.obsPhase==='transition'){
    const lo=TUNE.obsLoosen;
    if(tier==='A'||tier==='B'){ if(ratio<lo) return {type:'nopurchase',text:`低单价过渡期 <${lo*100}% → 不采购`}; }
    else if(tier==='C'||tier==='D'||tier==='E'){ if(ratio<lo) return {type:'nopurchase',text:`低单价过渡期 <${lo*100}% → 不采购`}; }
    if(ctx.monthSales>TUNE.obsMinSales) ctx._obsHint = `月销 ${ctx.monthSales} > ${TUNE.obsMinSales} → 可发起例外审批（陈总）`;
  }
  /* ③ 财务季节调整 */
  if(TUNE.finSeason && mon){
    const autumnWinter = ctx.season==='冬款'||ctx.season==='春秋款';
    const summer = ctx.season==='夏款';
    if((mon===7||mon===8) && autumnWinter && (tier==='D'||tier==='E'))
      return {type:'none',finSeason:true,text:'7/8月秋冬推广期 → 价格评级D/E调整为正常采购'};
    if((mon===12||mon===1) && summer && (tier==='A'||tier==='B') && ratio<0.70)
      return {type:'cap',d:mon===12?75:65,finSeason:true,text:`夏款${mon}月 AB级 <70% → A封顶75 / B封顶65（当月封顶${mon===12?75:65}天）`};
    if(mon===10 && (tier==='A'||tier==='B') && ratio<0.70)
      return {type:'cap',d:tier==='A'?75:65,finSeason:true,text:`10月前 AB级 <70% 也可采 → ${tier}封顶${tier==='A'?75:65}天`};
  }
  const grp = (owner==='S'||owner==='A'||owner==='B'||owner==='C') ? 'ABC' : 'DE';
  if(grp==='ABC'){
    if(tier==='A'||tier==='B'){
      if(ratio<0.70) return {type:'nopurchase',text:'<70% → 不采购'};
      if(ratio<0.75) return {type:'sub',d:20,text:'70–75% → 减 20 天'};
      if(ratio<0.80) return {type:'sub',d:10,text:'75–80% → 减 10 天'};
      if(ratio<0.85) return {type:'sub',d:5,text:'80–85% → 减 5 天'};
      return {type:'none',text:'≥85% → 不调整'};
    }
    if(tier==='C'){
      if(ratio<0.75) return {type:'nopurchase',text:'<75% → 不采购'};
      if(ratio<0.80) return {type:'sub',d:20,text:'75–80% → 减 20 天'};
      if(ratio<0.85) return {type:'sub',d:15,text:'80–85% → 减 15 天'};
      if(ratio<0.90) return {type:'sub',d:10,text:'85–90% → 减 10 天'};
      return {type:'none',text:'≥90% → 不调整'};
    }
    if(tier==='D'){
      if(ratio<0.80) return {type:'nopurchase',text:'<80% → 不采购'};
      if(ratio<0.90) return {type:'cap',d:75,text:'80–90% → 封顶 75 天'};
      return {type:'cap',d:80,text:'>90% → 封顶 80 天'};
    }
    if(ratio<0.80) return {type:'nopurchase',text:'<80% → 不采购'};
    if(ratio<0.90) return {type:'cap',d:60,text:'80–90% → 封顶 60 天'};
    return {type:'cap',d:65,text:'>90% → 封顶 65 天'};
  }
  if(tier==='C'||tier==='D'||tier==='E') return {type:'cap',d:60,caution:true,text:'价格评级较差 → 封顶 60 天 + 谨慎提示'};
  if(ratio<0.70) return {type:'nopurchase',text:'<70% → 不采购'};
  if(ratio<0.75) return {type:'sub',d:20,text:'70–75% → 减 20 天'};
  if(ratio<0.80) return {type:'sub',d:10,text:'75–80% → 减 10 天'};
  if(ratio<0.85) return {type:'sub',d:5,text:'80–85% → 减 5 天'};
  return {type:'none',text:'≥85% → 不调整'};
}
/* 月度拆分（Step3⑤）：月i天数 = MIN(MAX(0, O − 前几个月已占), di) × ci */
function monthSplit(O, coef){
  const rows=[]; let used=0;
  for(let i=0;i<5;i++){
    const d=TUNE._md[i], raw=Math.min(Math.max(0,O-used),d);
    rows.push({d, raw, c:coef[i], days:+(raw*coef[i]).toFixed(2)});
    used+=raw;
  }
  return {rows, Z:+rows.reduce((s,r)=>s+r.days,0).toFixed(2)};
}
/* 四渠道（Step5）：窗口 + 星期修正 → 月度嵌套拆分 */
function channelCalc(p){
  const wd = new Date(META.dataDate).getDay();
  const fix = TUNE.chOwnerFix[p.owner]!=null?TUNE.chOwnerFix[p.owner]:0;
  const wins = {
    '特快': TUNE.chWin['特快'],
    '专线': TUNE.chWin['专线'] + fix + (TUNE.chWeekFix['专线'][wd]||0),
    '美森': TUNE.chWin['美森'] + (TUNE.chWeekFix['美森'][wd]||0),
    '普船': TUNE.chWin['普船'] + (TUNE.chWeekFix['普船'][wd]||0)
  };
  const coef = p.monthCoef, cum={}, perCh={};
  let acc=0; CH_ORDER.forEach(ch=>{ acc+=wins[ch]; cum[ch]=acc; });
  let prev=[0,0,0,0,0];
  CH_ORDER.forEach(ch=>{
    const u=[]; let used=0;
    for(let i=0;i<5;i++){
      const raw=Math.min(Math.max(0,cum[ch]-used),TUNE._md[i]);
      u.push(+(raw*coef[i]-prev[i]).toFixed(2)); used+=raw;
    }
    perCh[ch]=u; prev=prev.map((x,i)=>+(x+u[i]).toFixed(2));
  });
  const totals={}; CH_ORDER.forEach(ch=>totals[ch]=+perCh[ch].reduce((a,b)=>a+b,0).toFixed(2));
  return {wins, perCh, totals, weekday:wd, ownerFix:fix};
}

    p.isLowPrice = p.target < TUNE.lowPrice;         // 低单价产品
    p.obsPhase  = p.isLowPrice && p.listAgeMonths>=TUNE.obsRelaxFrom && p.listAgeMonths<TUNE.obsMonths
                  ? 'transition' : (p.isLowPrice && p.listAgeMonths<TUNE.obsMonths ? 'observe' : null);
    /* Step 1 销量侧（父体聚合口径，SKU 拆分见下） */
    p.wAvg   = +(p.s7*TUNE.w[0] + p.s14*TUNE.w[1] + p.s28*TUNE.w[2]).toFixed(2);
    p.realSales = +(p.wAvg * (1 - p.ret*p.avl)).toFixed(2);
    p.grade  = gradeOf(p.realSales);
    p.tier   = p.ptier || PRICE_TIER[p.price] || 'C';   // 财务价格评级（导入）；缺省回退价位段推断
    p.disc   = p.disc_ != null ? p.disc_ : +(p.target * p.ratio).toFixed(2);   // 4周折后价（导入或按比例反推）
    p.ratio  = +(p.disc / p.target).toFixed(4);                                // 比例 = 折后价 ÷ 目标价

    /* Step 2 库存侧 */
    p.stockTotal = p.avail+p.transit+p.onorder+p.local+p.repair;   // 全渠道库存
    p.fbaTotal   = p.avail+p.transit;                              // FBA 总库存（预配数不参与扣减）
    p.seaStock   = p.fbaTotal - p.sea;                             // 减海运库存
    p.sellDays   = p.realSales>0 ? +(p.seaStock/p.realSales).toFixed(1) : 0; // 可售天数
    p.localTotal = p.pool;                                         // 本地可用总库存（发货池）

    /* Step 3 采购天数政策 */
    const monthIdx=new Date(META.dataDate).getMonth();
    p.matrix = matrixOf(p.season, p.owner, monthIdx);   // 查表落空 → 0
    const lad = ladderRule(p.owner, p.tier, p.ratio, {
      isNew90:p.isNew90, obsPhase:p.obsPhase, monthSales:p.s28*30, month:new Date(META.dataDate).getMonth()+1, season:p.season });
    if(lad._obsHint===undefined && p.obsPhase==='transition'){}   // hint 由 ctx._obsHint 透出
    p.obsHint = lad.text && lad.text.includes('例外审批') ? lad.text : null;
    p.ladder = lad;
    const scoreFix = p.score<=TUNE.scoreCut ? -TUNE.scoreSub : 0;
    const leadFix  = p.lead<TUNE.leadLo ? -TUNE.leadSub : (p.lead>TUNE.leadHi ? TUNE.leadAdd : 0);
    p.N = p.matrix + scoreFix + leadFix;
    p.sysDays = lad.type==='nopurchase' ? null
              : lad.type==='sub'  ? Math.max(0, p.N - lad.d)   // 减法结果不为负：采购天数没有负数口径
              : lad.type==='cap'  ? Math.min(p.N, lad.d)
              : p.N;
    p.noPurchase = lad.type==='nopurchase';
    p.planDays = p.manualDays!=null ? p.manualDays : (p.sysDays!=null?p.sysDays:0);
    p.chain = { matrix:p.matrix, score:scoreFix, lead:leadFix, ladder:lad, manual:p.manualDays||null };

    const cfg = MONTH_COEF_CFG.find(m=>m.id===p.id);
    p.monthCoef = cfg ? cfg.v : (SEASON_COEF[p.season]||SEASON_COEF['四季']);
    const ms = monthSplit(p.planDays, p.monthCoef);
    p.months = ms.rows; p.Z = ms.Z;
    p.covDaysAgg = +(p.Z * TUNE.gradeCoef[p.grade]).toFixed(2);       // 父体聚合口径的等级覆盖天数

    /* Step 4 补货量与采购量（SKU 级）+ Step 5 四渠道 */
    const ch = channelCalc(p); p.ch = ch;
    p.skus = [];
    p.colors.forEach(c=>{
      Object.entries(p.sizes).forEach(([sz,sw])=>{
        const w = c.w*sw;
        const realSku = +(p.realSales*w).toFixed(3);
        const gSku   = gradeOf(realSku);
        const covSku = +(p.Z * TUNE.gradeCoef[gSku]).toFixed(2);
        const P = +(realSku*covSku).toFixed(2);
        const stockSku = +(p.stockTotal*w).toFixed(2);
        const Q = +(P - stockSku).toFixed(2);
        const seaSku = +(p.sea*w).toFixed(2);
        const localSku = +(p.localTotal*w).toFixed(2);
        const sellDaysSku = realSku>0 ? +(((p.avail+p.transit)*w - seaSku)/realSku).toFixed(1) : 0;
        /* Step5③ SKU 级库存抵扣 */
        const bufOut = Math.max(sellDaysSku - TUNE.buffer, 0);
        const t = ch.totals;
        const dFast  = Math.max(t['特快'] - bufOut, 0);
        const dLine  = t['专线']*TUNE.gradeCoef[gSku] - Math.max(bufOut - t['特快'], 0);
        const dMatson= t['美森'] + Math.min(dLine,0) - seaSku;
        const negSoFar = Math.min(0, dLine) + Math.min(0, dMatson);
        const dBoat  = t['普船'] + negSoFar - Math.max(seaSku - Math.max(dMatson,0), 0);
        /* Step5④ 数量分配：从本地可用总库存按快→慢依次划拨（整件，不超池） */
        const days = {'特快':dFast,'专线':dLine,'美森':dMatson,'普船':dBoat};
        const alloc = {}; let remain = Math.floor(localSku);
        CH_ORDER.forEach(ch2=>{
          const q = Math.max(0, Math.ceil(days[ch2]*realSku));
          alloc[ch2] = Math.min(q, Math.max(0,remain)); remain = Math.max(0, remain - alloc[ch2]);
        });
        const codes = skuCodes(p, c.c, sz);
        p.skus.push({ sku:codes.chSku, asin:codes.asin, chSku:codes.chSku, facSku:codes.facSku,
          label:codes.label, title:codes.title, color:c.c, size:sz, w, realSku, grade:gSku,
          covDays:covSku, P, stock:stockSku, Q, sellDays:sellDaysSku, days, alloc, local:localSku });
      });
    });
    p.purchase = p.manualQty!=null ? p.manualQty
      : (p.noPurchase ? 0 : +p.skus.reduce((s,x)=>s+x.Q,0).toFixed(2));
    p.P = +p.skus.reduce((s,x)=>s+x.P,0).toFixed(2);
    /* 父体四渠道数量 = SKU 汇总 */
    p.chQty = {}; CH_ORDER.forEach(ch2=>p.chQty[ch2]=p.skus.reduce((s,x)=>s+x.alloc[ch2],0));
    /* 销售等级分布（SPU 表展示） */
    const mix={}; p.skus.forEach(s=>mix[s.grade]=(mix[s.grade]||0)+1);
    p.gradeMix = Object.entries(mix).map(([g,n])=>`${g}×${n}`).join(' ');
  });
}

/* ============================================================
   2.1 SKU 编码口径（子ASIN / 渠道SKU / 工厂SKU / 标签FNSKU）
   真实系统里一个规格对应四条编码，均由「父体款号 + 颜色码 + 尺码」确定性派生，
   原型用哈希生成，刷新与切换层级都保持稳定，接真实数据时替换为字段直读。
   ============================================================ */
const COLOR_CODE={'军绿色':'AG','军绿':'AG','燕麦色':'OT','黑色':'B','白色':'WH','花灰':'HG','雾灰':'WG','卡其':'KH','深灰':'DG','浅蓝':'LB','深蓝':'BL','云朵白':'CW','薄荷绿':'MT','藏青':'NV','藏蓝':'NA','奶白':'MW','焦糖':'CR','浅灰':'LG','粉':'PK'};
const SKU_ALNUM='0123456789ABCDEFGHJKLMNPQRSTUVWXYZ';
function hash32(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h>>>0; }
function alnumBy(seed,n){ let out='',h=hash32(seed); for(let i=0;i<n;i++){ if(h<32) h=hash32(seed+'#'+i+out); out+=SKU_ALNUM[h%32]; h=Math.floor(h/32); } return out; }
function colorCode(c){ return COLOR_CODE[c]||'XX'; }
function skuCodes(p,color,size){
  const cc=colorCode(color), key=`${p.asin}|${color}|${size}`;
  return {
    asin:  'B0'+alnumBy(key,8),
    chSku: `${p.chn}_${cc}_${size}`,
    facSku:`OK_${p.fac}_${cc}_${size}`,
    label: 'X00'+alnumBy('L'+key,7),
    title: `OK_${p.fac}_${color}_${size}`
  };
}
function statusTag(s){
  const m={'待处理':'amber','已采纳':'green','已改量':'blue','已拒绝':'gray'};

}

}

/* —— 统计报表：30 天历史序列（确定性派生演示数据；接真实系统时替换为 BI 按日聚合） —— */
const TREND = (()=>{
  const N=30, today=new Date(new Date(META.dataDate).getTime());
  const dates=[...Array(N)].map((_,i)=>{ const d=new Date(today.getTime()-(N-1-i)*86400000); return `${d.getMonth()+1}/${d.getDate()}`; });
  /* 销量：基线 46/天，周末高、工作日平，逐步爬升，促销尖峰 */
  const sales=[...Array(N)].map((_,i)=>{
    const dow=(today.getDay()-(N-1-i)%7+7)%7;
    const wk=[1.18,1.0,0.94,1.0,1.1,1.32,1.16][dow];
    const trend=0.86+0.34*i/(N-1);
    const promo=(i===8||i===9)?1.9:(i===21?1.5:1);
    return Math.round(46*wk*trend*promo);
  });
  /* 采购量：隔天下单的脉冲序列（对照下单节奏） */
  const purchase=[...Array(N)].map((_,i)=>{
    if(i%4!==1) return 0;
    const v=320+((hash32('pur'+i)%260));
    return v;
  });
  /* 库存（全渠道件数）：每天被销量消耗、采购日跳升，缓降中偶尔回补 */
  let stock=9800; const inv=[stock];
  for(let i=1;i<N;i++){ stock=stock-sales[i]-14+purchase[i]*0.9; inv.push(Math.round(stock)); }
  /* 缺口（Q>0 的 SKU 数）：与销量正相关 */
  const gapSkus=[...Array(N)].map((_,i)=>Math.max(18,Math.round(sales[i]*0.72+((hash32('gap'+i)%90)/10)-4)));
  return {dates,sales,purchase,inv,gapSkus};
})();
/* 迷你折线/面积图：SVG 生成（无依赖） */
function miniChart(series,opts={}){
  const {h=120,color='var(--brand)',fill=true,unit=''}=opts;
  const all=series.flatMap(s=>s.v);
  const mn=Math.min(...all,0), mx=Math.max(...all,1);
  const W=300,H=100;
  const pts=s=>s.v.map((v,i)=>`${(i/(s.v.length-1)*W).toFixed(1)},${(H-(v-mn)/(mx-mn||1)*H).toFixed(1)}`).join(' ');
  const path=s=>`<polyline points="${pts(s)}" fill="none" stroke="${s.color||color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>`;
  const area=s=>`<polygon points="0,${H} ${pts(s)} ${W},${H}" fill="${s.color||color}" opacity="0.08"/>`;
  const bars=s=>s.v.map((v,i)=>{
    const bh=Math.max(0,(v-mn)/(mx-mn||1)*H);
    return `<rect x="${(i/s.v.length*W+1.2).toFixed(1)}" y="${(H-bh).toFixed(1)}" width="${(W/s.v.length-2.4).toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="${s.color||color}" opacity="${s.dim?0.45:1}"/>`;
  }).join('');
  const zeroY=H-(0-mn)/(mx-mn||1)*H;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${opts.zero?`<line x1="0" y1="${zeroY.toFixed(1)}" x2="${W}" y2="${zeroY.toFixed(1)}" stroke="var(--line-2)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`:''}
    ${series.map(s=>s.type==='bar'?bars(s):fill||s.fill?(area(s)+path(s)):path(s)).join('')}
  </svg>`;
}
function trendDelta(arr,n=7){
  const cur=arr.slice(-n).reduce((a,b)=>a+b,0)/n;
  const prev=arr.slice(-2*n,-n).reduce((a,b)=>a+b,0)/n;
  const d=prev?Math.round((cur-prev)/prev*100):0;
  return {d7:cur.toFixed(arr.every(x=>Number.isInteger(x))?0:0), pct:d};
}

/* ============================================================
   6. 页面：补货建议（三层看数）
   ============================================================ */
function filteredParents(){
  const f = state.sugg.f;
  return PARENTS.filter(p=>
    (!f.store  || p.store===f.store) &&
    (!f.sales  || p.grade===f.sales) &&
    (!f.price  || p.ptier===f.price) &&           /* v0.2：按财务价格评级 ptier 筛 */
    (!f.season || p.season===f.season) &&
    (!f.status || p.status===f.status) &&
    (!f.age    || (f.age==='new'? p.isNew90 : !p.isNew90)) &&
    (!f.kw || (p.id+p.name).toLowerCase().includes(f.kw.toLowerCase())));
}
/* 补货建议主列表：一行一个 SKU（铺平父体），parent 挂在行上便于取父体政策字段 */
function filteredSkus(){
 const f=state.sugg.f;
 return PARENTS.filter(p=>(!f.store||p.store===f.store)&&(!f.price||p.ptier===f.price)&&(!f.season||p.season===f.season)&&(!f.age||(f.age==='new'?p.isNew90:!p.isNew90))).flatMap(p=>p.skus.map(s=>({...s,parent:p}))).filter(x=>(!f.status||skuDecisionStatus(x)===f.status)&&(!f.sales||x.grade===f.sales)&&(!f.kw||[x.parent.id,x.parent.name,x.asin,x.chSku,x.facSku,x.label,x.title].join(' ').toLowerCase().includes(f.kw.toLowerCase())));
}
function skuParents(list){ return [...new Map(list.map(x=>[x.parent.id,x.parent])).values()]; }
function filterBar(extra=''){
  const f=state.sugg.f;
  const opt=(arr,cur,all)=>`<option value="">${all}</option>`+arr.map(v=>Array.isArray(v)?`<option value="${v[0]}" ${cur===v[0]?'selected':''}>${v[1]}</option>`:`<option ${cur===v?'selected':''}>${v}</option>`).join('');
  return `<div class="fbar">
    <span class="lab">筛选</span>
    <select onchange="setF('store',this.value)">${opt(STORES,f.store,'全部店铺')}</select>
    <select onchange="setF('sales',this.value)">${opt(['A+','A','B','C'],f.sales,'全部销售等级')}</select>
    <select onchange="setF('price',this.value)">${opt(['A','B','C','D','E'],f.price,'全部价格评级')}</select>
    <select onchange="setF('age',this.value)">${opt([['new','上架≤2个月'],['old','超2个月']],f.age,'全部上架时长')}</select>
    <select onchange="setF('season',this.value)">${opt(['夏款','春秋款','冬款','四季'],f.season,'全部季节')}</select>
    <select onchange="setF('status',this.value)">${opt(['待处理','已采纳','已改量','已拒绝'],f.status,'全部状态')}</select>
    <input placeholder="关键字：SKU / ASIN / 父体 / 款式 / 品名" value="${esc(f.kw)}" onkeydown="if(event.key==='Enter')setF('kw',this.value)"/>
    <button class="btn sm" onclick="setF('kw',document.querySelector('.fbar input').value)">查询</button>
    <button class="btn sm" onclick="resetF()">清空筛选</button>
    ${extra}
  </div>`;
}
window.setF=(k,v)=>{ state.sugg.f[k]=v; render(); };
window.resetF=()=>{ state.sugg.f={store:'',owner:'',sales:'',price:'',season:'',status:'',kw:''}; render(); };

/* ============================================================
   6.1 批量操作（选中态 / 导出 / 批量改天数 / 批量生成 FBA 补货单）
   列表口径：一行一个 SKU，勾选与批量操作均以 SKU 行为单位
   ============================================================ */
function selSet(){ if(!state.sugg.sel) state.sugg.sel={}; return state.sugg.sel; }
function isSel(k){ return !!selSet()[k]; }
/* 当前筛选可选中的 SKU 行（渠道SKU 全局唯一，直接作 key） */
function selKeys(){ return filteredSkus().map(x=>x.sku); }
/* 已选 SKU 行对象（含 parent） */
function selSkus(){ const set=selSet(); return filteredSkus().filter(x=>set[x.sku]); }
/* 兼容批量弹层：已选行折算成去重父体集合 */
function selParents(){ return skuParents(selSkus()); }
window.toggleSel=(k,cb)=>{ const s=selSet(); if(cb) s[k]=true; else delete s[k]; render(); };
window.selAllThis=(cb)=>{ selKeys().forEach(k=>{ if(cb) selSet()[k]=true; else delete selSet()[k]; }); render(); };
window.selInvert=()=>{ const s=selSet(); selKeys().forEach(k=>{ if(s[k]) delete s[k]; else s[k]=true; }); render(); };
window.selClear=()=>{ state.sugg.sel={}; render(); };
window.selAllFiltered=()=>{ const s=selSet(); filteredSkus().forEach(x=>s[x.sku]=true); render(); };
window.selOnlyPositive=()=>{ const s=selSet(); Object.keys(s).forEach(k=>delete s[k]);
  filteredSkus().forEach(x=>{ if(x.Q>0) s[x.sku]=true; }); render(); };

function batchBar(){
  const keys=selKeys(), n=keys.filter(k=>selSet()[k]).length;
  const all=keys.length>0 && n===keys.length;
  return `<div class="batchbar">
    <div class="brow1">
      <span class="lab">批量操作</span>
      <label style="display:flex;align-items:center;gap:5px;cursor:pointer">
        <input type="checkbox" ${all?'checked':''} onchange="selAllThis(this.checked)"/>
        <span>全选当前筛选</span>
      </label>
      <button class="btn sm" onclick="selInvert()" ${keys.length?'':'disabled'}>反选</button>
      <button class="btn sm" onclick="selClear()" ${n?'':'disabled'}>清空选择</button>
      <button class="btn sm link" onclick="selAllFiltered()">选中当前筛选全部 ${keys.length} 条</button>
      <button class="btn sm link" onclick="selOnlyPositive()">只选有缺口（Q&gt;0）</button>
    </div>
    <div class="brow2">
      <span>当前筛选内已选 <span class="cnt">${n}</span> 个 SKU · 对应 ${selParents().length} 个父体</span>

}
/* 批量操作的取值域：默认「已选」，弹层内可切「当前筛选全部」；单位一律是 SKU 行 */
function batchScope(){ return window.__bsScope==='all' ? 'all' : 'sel'; }

    toast(`已导出 ${csv.split('\n').length-1} 行补货数据`);

};

/* ---------- 批量设置天数（按 SKU 行取值；天数政策在父体，命中行去重后按父体覆盖） ---------- */

window.setBDays=d=>{ window.__bd.days=d; closeModal(); openBatchDays(); const el=$('#bd-days'); if(el) el.value=d; };
window.doBatchDays=()=>{
  const d=parseInt($('#bd-days').value);
  if(!(d>=0&&d<=365)) return toast('天数需在 0–365 之间');
  const list=batchItems();
  const plist=skuParents(list);
  const skip=plist.filter(p=>p.noPurchase&&!window.__bd.applyNoPurchase);
  plist.forEach(p=>{
    if(p.noPurchase&&!window.__bd.applyNoPurchase) return;
    p.manualDays=d; if(p.status==='待处理') p.status='已改量';
  });
  compute();
  closeModal();
  toast(`已按 ${list.length} 个 SKU 命中 ${plist.length-skip.length} 个父体，计划天数覆盖为 ${d} 天${skip.length?`，跳过 ${skip.length} 个不采购款`:''}，下次跑批生效`);
  render();
};

function chainHtml(p){
  const c=p.chain;
  const fix=n=>n>0?`<span class="fix plus">+${n}</span>`:(n<0?`<span class="fix minus">${n}</span>`:'<span class="muted">0</span>');
  const lad=p.ladder;
  const ladTag = lad.type==='nopurchase' ? `<span class="tag red"><span class="dot"></span>不采购</span>`
    : lad.type==='sub'  ? `<span class="tag amber"><span class="dot"></span>减 ${lad.d} 天</span>`
    : lad.type==='cap'  ? `<span class="tag amber"><span class="dot"></span>封顶 ${lad.d} 天</span>`
    : `<span class="tag gray"><span class="dot"></span>不调整</span>`;
  return `<div class="chain">
    <span class="node">M 矩阵 <b>${c.matrix}</b> 天</span><span class="arr">→</span>
    <span class="node">评分修正 ${fix(c.score)}</span><span class="arr">→</span>
    <span class="node">货期修正 ${fix(c.lead)}</span><span class="arr">→</span>
    <span class="node">N <b>${p.N}</b> 天</span><span class="arr">→</span>
    <span class="node">价格阶梯 ${ladTag} <span class="muted" style="font-size:11.5px">${esc(lad.text)}</span></span><span class="arr">→</span>
    ${c.manual!=null?`<span class="node manual">O 人工拍板 <b>${c.manual}</b> 天（优先）</span>`:`<span class="node">无人工覆盖</span>`}
    <span class="arr">→</span>

  </div>`;
}

const COLOR_HEX={'军绿色':'#5b6f4a','燕麦色':'#d9cba6','黑色':'#2c3038','白色':'#f4f4f0','花灰':'#b9bcbe','雾灰':'#b2b7b6','卡其':'#b79f6d','深灰':'#6d7176','浅蓝':'#a7c5e2','深蓝':'#3a5a8c','云朵白':'#f1efe8','薄荷绿':'#bcdfcb','藏青':'#27334c','奶白':'#efe7d3','焦糖':'#a5682e','浅灰':'#c8cacc','粉':'#e6c1c9'};

function isDarkHex(h){ const n=parseInt(h.slice(1),16); return (0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))<140; }
function prodImg(p,color,size=34){
  const hex=COLOR_HEX[color]||'#c8cacc';
  return `<span class="pimg" title="${esc(p.name||'')} · ${color}" style="width:${size}px;height:${size}px;background:${hex};color:${isDarkHex(hex)?'#fff':'#3a3f47'};font-size:${Math.max(10,Math.round(size*0.42))}px">${CAT_GLYPH[p.cat]||'品'}</span>`;
}
function skuPattern(p){ return `${p.chn}_{颜色码}_{尺码}`; }
function skuSummary(p){ return `${p.skus.length} 个 SKU（${p.colors.length} 色 × ${Object.keys(p.sizes).length} 码）`; }
/* ============================================================

}
function inCell(lbl,val,unit){
  return `<span class="bd-in"><span class="lbl">${lbl}</span><span class="v">${val}</span>${unit?`<span class="u">${unit}</span>`:''}</span>`;
}
function renderBoard(p){

  /* ── Step 1 销量侧 ── */
  const step1 = `
  <div class="bd-eq">加权平均销量 = 7天均销×<b>${TUNE.w[0]}</b> + 14天均销×<b>${TUNE.w[1]}</b> + 28天均销×<b>${TUNE.w[2]}</b>

  /* ── Step 2 库存侧 ── */
  const step2 = `

    <tr><td><b>现有库存可售天数</b></td><td class="mono" style="font-size:12px">减海运库存 ÷ 真实销量</td><td class="num"><b>${p.sellDays}</b> 天</td></tr>
    <tr><td>本地可用总库存</td><td class="mono" style="font-size:12px">本地库存表「剩余库存」+ 当天入库<span class="sub2">（四渠道发货池，另一套口径）</span></td><td class="num"><b>${fmt(p.localTotal)}</b></td></tr>
  </table>
  <div class="bd-formula">两套本地库存并存：<code>采购扣减 = BI 本地仓可用</code>、<code>发货池 = 本地库存表剩余 + 当天入库</code>，业务已确认差异正常。销量为 0 且库存为 0 时可售天数记 0。</div>`;

  /* ── Step 3 采购天数政策 ── */
  const step3 = `
  ${boardStep('①','建议天数 M','矩阵查表',`

  ${boardStep('③','价格阶梯','替代式 · 只走一行',`

    <div class="bd-formula">本款：财务价格评级 ${p.ptier} → 阶梯行 <b>${p.tier}</b>；比例 = $${(p.target*p.ratio).toFixed(2)} ÷ $${p.target.toFixed(2)} = <b>${(p.ratio*100).toFixed(1)}%</b> → 命中「${esc(lad.text)}」

  ${boardStep('⑥','等级覆盖天数','Z × 等级系数',`
    <div class="bd-eq">等级覆盖天数 = Z × 等级系数 = ${p.Z.toFixed(2)} × ${TUNE.gradeCoef[p.grade].toFixed(2)}（${p.grade}）= <b>${p.covDaysAgg.toFixed(2)}</b> 天
父体聚合口径（同 Z、同父体等级）：${p.covDaysAgg.toFixed(2)} 天</div>

  /* ── Step 4 补货量与采购量 ── */
  const step4 = `

  </table></div>
  <div class="bd-formula">库存按 <code>全渠道库存 × w</code> 折分到 SKU；采购量为负 = 库存冗余，<b>保留负值不归零</b>；FBA 预配数不参与扣减。</div>`;

  /* ── Step 5 四渠道 ── */
  const step5 = `

    <table class="tb">

  /* ── 常量阈值速查 ── */

    <tr><td>月份天数 di</td><td class="mono">${TUNE._md.join(' / ')}</td><td>Step3⑤⑤ 当月剩余 + 后 4 个月</td></tr>
    <tr><td>渠道基础窗口</td><td class="mono">特快 ${TUNE.chWin['特快']} / 专线 ${TUNE.chWin['专线']} / 美森 ${TUNE.chWin['美森']} / 普船 ${TUNE.chWin['普船']}</td><td>Step5① 需求覆盖窗口（天）</td></tr>

/* ============================================================
   6.6 SKU 补货详情（参考领星补货看板：单品详情 + 销量走势 + 库存模拟）
   ============================================================ */
function skuDetailBody(sku){
  const p=PARENTS.find(x=>x.skus&&x.skus.some(s=>s.sku===sku));
  if(!p) return '<div class="muted">未找到该 SKU</div>';
  const s=p.skus.find(v=>v.sku===sku);
  const q=s.Q>0?Math.ceil(s.Q):0;
  const gapDays=s.realSku>0?Math.ceil(q/s.realSku):0;

  /* —— 近 90 天销量：父体均销 × 颜色权重 × 尺码权重，叠加星期与随机波动（确定性派生） —— */
  const wAll=s.w;
  const days90=[];
  for(let d=89;d>=0;d--){
    const seed=hash32(sku+'#'+d);
    const date=new Date(new Date(META.dataDate).getTime() - d*86400000);
    const dow=date.getDay();
    const weekK=[1.25,1.0,0.95,1.0,1.1,1.35,1.15][dow];           // 周末小高峰
    const trend=0.78+0.5*(89-d)/89*(p.s28>p.s7?0.7:1.25);          // 上升/下降趋势
    const wave=0.72+((seed%1000)/1000)*0.56;                        // ±28% 波动
    const promo=d%29===0||d%29===1?2.1:1;                           // 月度小促
    const deNoise=wave>1.34||wave<0.80?1:wave;                      // 去噪：削峰填谷
    days90.push({d:89-d,date,v:Math.max(0,Math.round(p.s28*wAll*weekK*trend*deNoise*promo*10)/10)});
  }
  const vMax=Math.max(...days90.map(x=>x.v),1);
  const sum90=days90.reduce((a,x)=>a+x.v,0);
  /* —— 库存模拟：起点 = FBA(可用+在途)×w，消耗 = 日销量，到货段 = 四渠道分配 —— */
  const startStock=Math.round((p.avail+p.transit)*s.w);
  let run=startStock, stockLine=[], segs=[];
  const seaD=p.seaDet||{};
  const mrkW=Math.round(TUNE.chWin['普船']*1.15); /* 马士基窗口略长于普船 */
  const arrivals=[
    {day:Math.round(TUNE.chWin['特快']*0.7),n:s.alloc['特快'],cls:'line',lab:'特快到货 '+s.alloc['特快']},
    {day:Math.round(TUNE.chWin['专线']*0.8),n:s.alloc['专线'],cls:'line',lab:'专线到货 '+s.alloc['专线']},
    {day:Math.round(TUNE.chWin['美森']*0.9),n:s.alloc['美森'],cls:'boat',lab:'美森到货 '+s.alloc['美森']},
    {day:Math.round(TUNE.chWin['普船']*1.0),n:s.alloc['普船'],cls:'boat',lab:'普船到货 '+s.alloc['普船']},
    {day:mrkW,n:Math.round((seaD['马士基']||0)*s.w),cls:'boat',lab:'马士基在途到货 '+Math.round((seaD['马士基']||0)*s.w)}
  ].filter(a=>a.n>0).sort((a,b)=>a.day-b.day);
  const horizon=90;
  let stockTop=Math.max(startStock,1);
  for(let d=0;d<horizon;d++){
    const v=days90[d]?days90[d].v:0;
    run-=v;
    const hit=arrivals.filter(a=>a.day===d);
    if(hit.length) hit.forEach(a=>{ run+=a.n; segs.push({day:d,...a}); });
    stockTop=Math.max(stockTop,Math.round(run));
    stockLine.push(run);
  }
  const stockMax=stockTop*1.08;
  const X=d=>(d/horizon*100).toFixed(2);
  const Y=v=>((1-Math.max(0,v)/stockMax)*100).toFixed(2);
  const zeroIdx=stockLine.findIndex(v=>v<=0);
  const zeroDay=zeroIdx>=0?zeroIdx:null;
  let svgSegs='';
  segs.forEach(g=>{ svgSegs+=`<span class="skud-seg ${g.cls}" style="left:${X(g.day)}%;width:1.1%;top:6%;bottom:26%"></span>`; });
  /* SVG 折线（库存走势） */
  const pts=stockLine.map((v,d)=>`${(d/(horizon-1)*100).toFixed(2)},${Y(v)}`).join(' ');
  const svgLine=`<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:74%"><polyline points="${pts}" fill="none" stroke="var(--green)" stroke-width="0.9" vector-effect="non-scaling-stroke"/></svg>`;
  const zeroMark=zeroDay!=null?`<div class="skud-zero" style="top:${(6+74*(zeroDay/(horizon-1))).toFixed(1)}%"><b>第 ${zeroDay} 天断货</b></div>`:'';
  const segNotes=segs.map(g=>`<span><i class="sw" style="background:${g.cls==='boat'?'#8a63d2':'var(--brand)'};display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px"></i>${g.lab}（第 ${g.day} 天）</span>`).join('');

  /* —— 父体同款其他 SKU（切换） —— */
  const siblings=p.skus.filter(x=>x.sku!==s.sku).slice(0,12);

  return `
  <div class="bd-head">
    ${prodImg(p,s.color,54)}
    <div>
      <div class="t mono" style="font-size:14px">${s.sku}
        ${q>0?'<span class="tag red"><span class="dot"></span>需补货</span>':'<span class="tag green"><span class="dot"></span>库存充足</span>'}
      </div>
      <div class="s">${esc(s.title)} · ${p.store} · 父体 <span class="mono">${p.id}</span> ${esc(p.name)}</div>
      <div class="skud-ph" style="margin-top:6px">
        <span>子ASIN <b class="mono">${s.asin}</b></span>
        <span>工厂SKU <b class="mono">${s.facSku}</b></span>
        <span>标签 <b class="mono">${s.label}</b></span>
        <span>颜色 <b>${s.color}</b></span>
        <span>尺码 <b>${s.size}</b></span>
        <span>权重 <b>${(s.w*100).toFixed(1)}%</b></span>
      </div>
    </div>
    <div class="bd-chips">
      <span class="hdr-chip">数据日 <b>${META.dataDate}</b></span>
      <span class="hdr-chip">批次 <b>${META.latestBatch}</b></span>
      <span class="hdr-chip">配置 <b>${META.configVersion}</b></span>
    </div>
  </div>

  <div class="skud-kpis">
    <div class="c"><div class="k">真实日销</div><div class="v">${s.realSku.toFixed(2)}<small>件/天</small></div></div>
    <div class="c"><div class="k">销售等级</div><div class="v">${s.grade}<small>×${TUNE.gradeCoef[s.grade].toFixed(2)}</small></div></div>
    <div class="c"><div class="k">可售天数</div><div class="v">${s.sellDays}<small>天</small></div></div>
    <div class="c"><div class="k">覆盖天数</div><div class="v">${s.covDays.toFixed(1)}<small>天</small></div></div>
    <div class="c"><div class="k">补货量 P</div><div class="v">${fmt(s.P,1)}<small>件</small></div></div>
    <div class="c"><div class="k">全渠道库存</div><div class="v">${fmt(s.stock,1)}<small>件</small></div></div>
    <div class="c"><div class="k">采购量 Q</div><div class="v">${q>0?`<span class="gap">+${q}</span>`:s.Q<0?`<span class="over">${s.Q.toFixed(0)}</span>`:'0'}<small>件</small></div></div>
    <div class="c"><div class="k">90 天累计销量</div><div class="v">${fmt(sum90,0)}<small>件</small></div></div>
  </div>

  <div class="skud-sec">近 90 天销量走势<span class="muted">原销量 · 悬停查看；父体均销 × 颜色 × 尺码权重折分（演示数据）</span></div>
  <div class="skud-chart" title="柱高 = 当日销量">${days90.map(x=>`<span class="skud-bar" style="height:${Math.max(3,(x.v/vMax)*88).toFixed(1)}%" title="${x.date.toISOString().slice(0,10)} · ${x.v} 件"></span>`).join('')}</div>
  <div class="skud-x">${[0,29,59,89].map(i=>`<span style="flex:${i===0?30:i===89?31:30};text-align:${i===0?'left':i===89?'right':'center'}">-${89-i}天</span>`).join('')}</div>
  <div class="skud-lg"><span><i class="sw" style="background:#c9d0ea"></i>日销量</span><span>峰值 ${vMax} 件/天</span><span>90 天合计 ${fmt(sum90,0)} 件</span><span>日均 ${(sum90/90).toFixed(1)} 件</span></div>

  <div class="skud-sec">库存模拟走势<span class="muted">不补货时的断货风险与到货影响 · 安全缓冲 ${TUNE.buffer} 天</span></div>

window.actSku=(sku,kind)=>{

  if(kind==='adopt'){ p.status='已采纳'; toast(`已采纳 ${sku}（父体 ${p.id}），按建议量标记已采纳`); render(); return; }
  if(kind==='reject'){ p.status='已拒绝'; toast(`已拒绝 ${sku}（父体 ${p.id}），仅标记不产生记录`); render(); return; }

window.saveQty=(sku)=>{
  const x=filteredSkus().find(v=>v.sku===sku); if(!x) return;

};

/* SKC 颜色字段级回写：颜色名称 / 颜色权重 → compute() 重算（权重即时折分到该色全部 SKU） */
window.updC=el=>{
  const d=el.dataset, p=PARENTS.find(x=>x.id===d.p); if(!p) return;
  const c=p.colors[+d.ci]; if(!c) return;
  if(d.f==='c'){ c.c=el.value; }
  else if(d.f==='w'){ c.w=Math.max(0,parseFloat(el.value)||0)/100; }
  compute(); renderHeader();
};
/* SKU 尺码字段级回写：尺码名称 / 尺码权重（对象键迁移）→ compute() 重算 */
window.updS=el=>{
  const d=el.dataset, p=PARENTS.find(x=>x.id===d.p); if(!p) return;
  if(d.f==='s'){
    const old=d.s;
    if(el.value && el.value!==old && p.sizes[el.value]==null){
      const entries=Object.entries(p.sizes).map(([k,v])=>[k===old?el.value:k,v]);
      p.sizes=Object.fromEntries(entries);
    }
  } else if(d.f==='w'){
    p.sizes[d.s]=Math.max(0,parseFloat(el.value)||0)/100;
  }
  compute(); renderHeader();
};

window.saveRowEdit=(pid)=>{
  const p=PARENTS.find(x=>x.id===pid); if(!p) return;
  const g=f=>{const el=document.getElementById('re-'+f);return el?el.value:null;};
  const num=f=>{const v=g(f);return v==null||v===''?null:parseFloat(v);};
  const name=g('name'); if(name!=null)p.name=name;
  const season=g('season'); if(season)p.season=season;
  const owner=g('owner'); if(owner)p.owner=owner;
  const finance=g('financeRating'); if(finance!=null)p.financeRating=finance.trim().toUpperCase();
  const lead=num('lead'); if(lead!=null)p.lead=lead;
  const score=num('score'); if(score!=null)p.score=score;
  const target=num('target'); if(target!=null)p.target=target;
  const disc_=num('disc_'); if(disc_!=null)p.disc_=disc_;
  const ptier=g('ptier'); if(ptier)p.ptier=ptier;
  const ret=num('ret'); if(ret!=null)p.ret=ret/100;
  const avl=num('avl'); if(avl!=null)p.avl=avl/100;
  const fo=g('firstOrder'); if(fo)p.firstOrder=fo;
  /* 月度销量系数：5个值任一有变 → 写入/新增父体专属配置 */
  const coefs=[0,1,2,3,4].map(i=>{const el=document.getElementById('re-coef'+i);return el?parseFloat(el.value):null;});
  if(coefs.every(v=>v!=null&&!isNaN(v))){
    let cfg=MONTH_COEF_CFG.find(m=>m.id===pid);
    if(cfg) cfg.v=coefs; else MONTH_COEF_CFG.push({id:pid,v:coefs});
  }
  compute(); closeModal(); render();
  toast(`已保存 ${pid} 并重算（含销量系数→Z→P/Q 全链）`);
};

  const t=IMP_TYPES.find(x=>x.k===s.type);
  const sameType=IMPORT_VERSIONS.filter(v=>v.type.replace(/\s/g,'')===t.t.replace(/\s/g,''));
  const ver='v'+(sameType.length?parseInt(sameType[0].ver.slice(1))+1:1);
  const stat={spu:{ok:88,total:90},skc:{ok:210,total:212},sku:{ok:486,total:500}}[s.type];
  IMPORT_VERSIONS.unshift({type:t.t,ver,file:s.file,sheet:t.t.replace(/表$/,''),by:META.operator,time:'10-19 23:10',ok:stat.ok,total:stat.total,status:'成功',err:stat.total-stat.ok,cover:0});

  toast(`导入完成（${t.t} ${ver}）：入库 ${stat.ok} / 总行 ${stat.total}，最新版本供后续跑批使用`);
};

window.regInput=el=>{
  const p=PARENTS.find(x=>x.id===el.dataset.reg); if(!p) return;
  const v=Math.max(0,+el.value||0), k=el.dataset.k;
  if(k==='inb') p.inb=v;
  else if(k==='red') p.red=v;
  else if(k==='repair') p.repair=v;
  else{
    const key={'seaM':'美森','seaP':'普船','seaMr':'马士基'}[k];
    if(key){ p.seaDet=p.seaDet||{'美森':0,'普船':0,'马士基':0}; p.seaDet[key]=v; }
  }
  p.sea=(p.seaDet?p.seaDet['美森']+p.seaDet['普船']+p.seaDet['马士基']:0);
};
window.saveCfg=(name)=>{
  const m=META.configVersion.match(/v(\d+)/); META.configVersion='v'+(+m[1]+1);

};

/* 采购计算字段级回写：改父体原始字段 → compute() 全链重算（含月度销量系数联动） */
window.updP=el=>{
  const d=el.dataset, pid=d.p, f=d.f;
  const p=PARENTS.find(x=>x.id===pid); if(!p) return;
  let v=el.value;
  if(['lead','score','target','ret','avl'].includes(f)) v=parseFloat(v)||0;
  if(f==='ret'||f==='avl') v=v/100;                       // 百分比输入 → 小数存储
  if(f==='disc_') p.disc_=parseFloat(v)||0;               // 折后价走独立字段，compute 里换算 ratio
  else p[f]=v;
  compute(); renderHeader();
};

/* 配置输入回写（原型内改参数即时生效，保存后生成新版本） */
window.upd=el=>{
  const d=el.dataset, v=parseFloat(el.value);
  if(d.cfg==='matrix') MATRIX[d.site][+d.r][2][+d.c]=v||0;
  else if(d.cfg==='month') MONTH_COEF_CFG[+d.r].v[+d.c]=v||0;
  else if(d.cfg==='season') SEASON_COEF[Object.keys(SEASON_COEF)[+d.r]][+d.c]=v||0;   /* v0.2.1：季节默认系数可直接编辑 */
  else if(d.cfg==='seasonAdd'){ /* 预留 */ }
  else if(d.cfg==='chwin') TUNE.chWin[d.k]=v||0;
  else if(d.cfg==='cut') TUNE.gradeCut[+d.i]=v||0;
  else if(d.cfg==='gcoef') TUNE.gradeCoef[d.k]=v||0;
  else if(d.cfg==='w') TUNE.w[+d.i]=v||0;
  else if(d.cfg==='tune') TUNE[d.k]=v||0;
  compute();
};

    </div>
  </div>`;
}

<script>
/* 小范围交互修订：不改变原有计算和父体保存口径。记录仅保留当前打开期间。 */
const LIGHT={pending:false,records:[],candidate:null};
function lightRecord(text,reason=''){LIGHT.records.unshift({time:new Date().toLocaleString('zh-CN'),text,reason})}
window.lightHistory=()=>openModal({title:'本次操作记录',wide:true,body:LIGHT.records.length?LIGHT.records.map(r=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${esc(r.text)}</b><div class="muted">${esc(r.time)} · ${esc(r.reason||'无补充原因')}</div></div>`).join(''):'暂无操作记录。',footer:'<span class="muted">仅保留当前打开期间，刷新后清空。</span><button class="btn" onclick="closeModal()">关闭</button>'});
const lightRender=render;
render=function(){lightRender();const page=$('#page');if(state.route==='suggestions'){page.insertAdjacentHTML('afterbegin',`<div class="note ${LIGHT.pending?'warn':'info'}"><span class="ic">${LIGHT.pending?'!':'i'}</span><span>${LIGHT.pending?'<b>待跑批生效</b> · 当前页面包含修改后的即时重算展示，不能视为已成功批次结果。':'尚无本次待生效修改。'} 最近成功批次：<b>${META.latestBatch}</b>。<button class="btn sm link" onclick="lightHistory()">本次操作记录（${LIGHT.records.length}）</button></span></div>`);const btn=[...page.querySelectorAll('button')].find(b=>b.textContent==='按昨日数据重跑');if(btn){btn.textContent='模拟重跑提示';btn.onclick=()=>toast('原型未接入后台任务；未发起真实跑批，待生效标记保留')}}};
const lightPurchase=purchaseCell;
purchaseCell=function(p){return p.purchase<0&&!p.noPurchase?`<span class="muted" title="净缺口为负表示库存冗余，不表示需要负数采购">冗余 ${fmt(-p.purchase,1)} 件</span>`:lightPurchase(p)};
window.actSku=(sku,kind)=>{const x=filteredSkus().find(s=>s.sku===sku);if(!x)return toast('未找到该 SKU');lightDecision(x.parent,x,kind)};
function lightDecision(p,x,kind){const qty=kind==='qty',reject=kind==='reject';window.__lightAction={id:p.id,sku:x?.sku||p.id,kind};openModal({title:`${qty?'改量':reject?'拒绝':'采纳'} · 父体 ${p.id}`,body:`<div class="note warn"><span class="ic">!</span><span>从 ${esc(x?.sku||p.id)} 发起，实际按父体保存。影响父体 <b>${p.id}</b> 的全部 <b>${p.skus.length}</b> 个 SKU，包括未选中的同款规格。</span></div><div class="frm"><span>当前父体状态</span><b>${esc(p.status)}</b>${qty?`<span>SKU 净缺口（参考）</span><b>${x?fmt(x.Q,1):'—'} 件</b><span>父体净缺口合计</span><b>${fmt(p.skus.reduce((n,s)=>n+s.Q,0),1)} 件</b><span>原人工采购记录</span><b>${p.manualQty!=null?fmt(p.manualQty)+' 件':'暂无'}</b><span>本次父体采购总量</span><input id="m-qty" type="number" min="0" step="1" value="${p.manualQty??Math.max(0,Math.ceil(p.purchase))}">`:''}<span>${kind==='adopt'?'原因（选填）':'原因（必填）'}</span><textarea id="m-note" placeholder="请填写本次决定的依据"></textarea></div><div class="muted" style="margin-top:12px">${qty?'填写父体当天累计总量，重复保存会覆盖旧值，不会追加。':''}保存只记录人工决定，不会向供应商下单；操作记录仅保留本次打开期间。</div>`,footer:'<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="lightSubmitDecision()">核对并保存</button>'})}
window.lightSubmitDecision=()=>{const a=window.__lightAction,p=PARENTS.find(p=>p.id===a.id),reason=$('#m-note').value.trim();if(a.kind!=='adopt'&&!reason)return toast('请填写调整或拒绝原因');const value=a.kind==='qty'?$('#m-qty').value.trim():null;const qty=value===null?null:Number(value);if(a.kind==='qty'&&(value===''||!Number.isInteger(qty)||qty<0))return toast('采购量须为非负整数');LIGHT.candidate={...a,qty,reason};if(a.kind==='qty'&&p.manualQty!=null){openModal({title:'确认覆盖原采购记录',body:`父体 <b>${p.id}</b>：原记录 <b>${p.manualQty} 件</b> → 本次 <b>${qty} 件</b>。<p>本次填写的是累计总量，确认后覆盖原值，不追加。影响同款 ${p.skus.length} 个 SKU。</p>`,footer:'<button class="btn" onclick="LIGHT.candidate=null;closeModal()">取消覆盖</button><button class="btn primary" onclick="lightCommitDecision()">确认覆盖</button>'});return}lightCommitDecision()};
window.lightCommitDecision=()=>{const a=LIGHT.candidate;if(!a)return;const p=PARENTS.find(p=>p.id===a.id),old=p.manualQty;p.status=a.kind==='qty'?'已改量':a.kind==='reject'?'已拒绝':'已采纳';if(a.kind==='qty'){p.manualQty=a.qty;compute()}const text=`父体 ${p.id} ${p.status}${a.kind==='qty'?`：${old??'未录入'} → ${a.qty} 件`:''}，涉及 ${p.skus.length} 个 SKU`;lightRecord(text,a.reason);LIGHT.candidate=null;closeModal();render();toast(text+'；未向供应商下单')};
window.saveQty=()=>lightSubmitDecision();
window.saveQtyParent=id=>{const p=PARENTS.find(p=>p.id===id);lightDecision(p,null,'qty')};
const lightAct=window.act;
// Intercept parent-level legacy buttons when present, so they share the same validation.
if(lightAct)window.act=(id,kind)=>{if(['qty','adopt','reject'].includes(kind)){const p=PARENTS.find(p=>p.id===id);if(p)return lightDecision(p,null,kind)}return lightAct(id,kind)};
window.saveDays=id=>{const p=PARENTS.find(p=>p.id===id),raw=$('#m-days').value.trim(),days=Number(raw);if(raw===''||!Number.isInteger(days)||days<0||days>365)return toast('天数需为 0–365 的整数');const old=p.planDays;p.manualDays=days;compute();LIGHT.pending=true;lightRecord(`父体 ${id} 计划天数：${old} → ${days} 天，涉及 ${p.skus.length} 个 SKU，待跑批生效`);closeModal();render();toast(`父体 ${id}：${old} → ${days} 天，待下次跑批生效`)};
const lightCfg=saveCfg;
window.saveCfg=name=>{LIGHT.pending=true;lightRecord(`${name}已保存为演示配置，待跑批生效`);lightCfg(name)};
const lightBatchOpen=openBatchDays;
window.openBatchDays=()=>{lightBatchOpen();if(!$('#bd-days'))return;const list=batchItems(),parents=skuParents(list);$('#bd-days').setAttribute('min','0');$('#bd-days').setAttribute('max','365');$('#bd-days').setAttribute('step','1');$('#bd-why').placeholder='必填：记录本次批量调整依据';$('#modal-box .modal-b')?.insertAdjacentHTML('afterbegin',`<div class="note warn">当前范围 ${list.length} 个 SKU，将命中 ${parents.length} 个父体，整款最多涉及 ${parents.reduce((n,p)=>n+p.skus.length,0)} 个 SKU（不采购父体默认跳过）。</div>`)};
window.setBDays=d=>{window.__bd.days=d;$('#bd-days').value=d;toast('已填写 '+d+' 天，保存时按输入值执行')};
window.doBatchDays=()=>{const raw=$('#bd-days').value.trim(),d=Number(raw),reason=$('#bd-why').value.trim();if(raw===''||!Number.isInteger(d)||d<0||d>365)return toast('天数需为 0–365 的整数');if(!reason)return toast('请填写批量调整原因');const list=batchItems(),parents=skuParents(list),targets=parents.filter(p=>!p.noPurchase||window.__bd.applyNoPurchase);if(!targets.length)return toast('没有可更新的父体，不采购父体默认跳过');const changes=targets.map(p=>`${p.id}：${p.planDays} → ${d} 天`);targets.forEach(p=>p.manualDays=d);compute();LIGHT.pending=true;lightRecord(`批量调整 ${targets.length} 个父体，涉及 ${targets.reduce((n,p)=>n+p.skus.length,0)} 个 SKU；${changes.join('；')}；待跑批生效`,reason);closeModal();render();toast(`已调整 ${targets.length} 个父体为 ${d} 天，跳过 ${parents.length-targets.length} 个父体；待跑批生效`)};
render();
</script>

<script>
/* S级审批闸门：owner 始终保存已生效评级，申请值独立保存。 */
const S_APPS=[],S_EFFECTIVE=new Map();let S_SEQ=1;
function sKey(p){return JSON.stringify([p.store,p.id])}
function sPending(p){return S_APPS.find(a=>a.key===sKey(p)&&a.status==='待审')}
function sTime(){return new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})}
function sRequest(p,source){const key=sKey(p),old=S_EFFECTIVE.get(key)||'';if(old==='S'){p.owner='S';return}p.owner=old;const prior=sPending(p);if(prior)return prior;const a={id:'S-'+String(S_SEQ++).padStart(4,'0'),key,store:p.store,spu:p.id,name:p.name,old,source,by:META.operator||'当前操作人',time:sTime(),status:'待审',who:'',reason:''};S_APPS.unshift(a);return a}
function sCancel(p){const a=sPending(p);if(a){a.status='已撤回';a.reason='商品重新设置为非S评级';a.who=META.operator||'当前操作人';a.handled=sTime()}}
PARENTS.forEach(p=>{S_EFFECTIVE.set(sKey(p),ratingNorm(p.owner)==='S'?ratingNorm(p.previousOwner||''):ratingNorm(p.owner));if(ratingNorm(p.owner)==='S')sRequest(p,'原型已有S级（未提供审批记录）')});
const sCompute=compute;
compute=function(){PARENTS.forEach(p=>{const value=ratingNorm(p.owner),key=sKey(p);if(value==='S'){sRequest(p,'商品资料设置')}else if(sPending(p)){p.owner=S_EFFECTIVE.get(key)||''}else{p.owner=value;S_EFFECTIVE.set(key,value)}});sCompute()};
const sUpd=updP;window.updP=el=>{if(el.dataset.f==='owner'){const p=PARENTS.find(p=>p.id===el.dataset.p),value=ratingNorm(el.value);if(value&&!FINANCE_GRADES.includes(value))return toast('运营评级仅支持 S/A/B/C/D/E');if(value!=='S')sCancel(p);el.value=value;sUpd(el);if(value==='S'){render();toast('S级已提交审批；通过前保留原有效评级')}}else sUpd(el)};
const sRowSave=saveRowEdit;window.saveRowEdit=id=>{const raw=$('#re-owner')?.value,p=PARENTS.find(p=>p.id===id);if(raw!==undefined){const v=ratingNorm(raw);if(v&&!FINANCE_GRADES.includes(v))return toast('运营评级仅支持 S/A/B/C/D/E');$('#re-owner').value=v;if(v!=='S'&&v!==ratingNorm(p.owner))sCancel(p)}sRowSave(id);if(sPending(p))toast('S级待审批，未作为有效评级参与计算')};
// The original file picker is a mock: wire its accepted SPU sample rows through the same gate.
const sImport=doImport;window.doImport=()=>{if(state.imp.type==='spu'&&state.imp.file){IMP_PREVIEW.spu.filter(r=>r[r.length-1]==='入库'&&ratingNorm(r[3])==='S').forEach(r=>{const matches=PARENTS.filter(p=>p.id===r[0]);if(matches.length===1)sRequest(matches[0],'SPU导入（原型样例）')})}sImport()};
function sApprovalPage(){const f=state.sGradeFilter??'待审',list=S_APPS.filter(a=>!f||a.status===f);return `<div class="card"><div class="card-h">运营 S 级审批 <span class="sub">按店铺 + SPU审批；通过后才启用S级</span><div class="sp"></div><span class="tag amber">待审 ${S_APPS.filter(a=>a.status==='待审').length}</span></div><div class="fbar">${[['待审','待审'],['已通过','已通过'],['已驳回','已驳回'],['全部','']].map(([t,k])=>`<button class="btn sm ${f===k?'primary':''}" onclick="state.sGradeFilter='${k}';render()">${t}</button>`).join('')}</div><div style="overflow:auto"><table class="tb"><tr><th>申请单</th><th>店铺 / SPU</th><th>来源 / 申请人</th><th>申请时间</th><th>原有效评级</th><th>申请评级</th><th>状态</th><th>审批记录</th><th>操作</th></tr>${list.map(a=>`<tr><td>${a.id}</td><td>${esc(a.store)}<br>${a.spu} · ${esc(a.name)}</td><td>${esc(a.source)}<br>${esc(a.by)}</td><td>${esc(a.time)}</td><td>${esc(a.old||'未评级')}</td><td><b>S</b></td><td><span class="tag ${a.status==='待审'?'amber':a.status==='已通过'?'green':'gray'}">${a.status}</span></td><td>${esc(a.who||'—')}<br>${esc(a.reason||'')}${a.handled?'<br>'+esc(a.handled):''}</td><td>${a.status==='待审'?`<button class="btn sm link" onclick="sReview('${a.id}','pass')">通过</button><button class="btn sm link" onclick="sReview('${a.id}','reject')">驳回</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="9" class="ph">暂无此状态的S级申请</td></tr>'}</table></div><div class="sumbar">待审或驳回时，继续按上一次已生效的运营评级计算；审批通过才切换为S级。无历史评级时提示缺失，不自动降级或赋值。审批仅在当前原型会话留存，未接入真实权限和后台审批服务。</div></div>`}
const sOldApproval=PAGES.approval;
PAGES.approval=()=>{
  const active=state.approvalTab||'sgrade';
  const tabs=[['sgrade','运营 S 级审批',S_APPS.filter(a=>a.status==='待审').length],['lowprice','低单价例外审批',APPROVALS.filter(a=>a.status==='待审').length]];
  return `<div class="card"><div class="card-h">审批中心 <span class="sub">按审批类型切换，分别处理待审申请</span></div><div class="cfg-tabs" role="tablist" aria-label="审批类型" style="padding:0 14px;display:flex;flex-wrap:nowrap;overflow-x:auto">${tabs.map(([key,label,n])=>`<button id="approval-tab-${key}" role="tab" aria-selected="${active===key}" aria-controls="approval-panel" class="cfg-tab ${active===key?'on':''}" style="white-space:nowrap" onclick="state.approvalTab='${key}';render()" onkeydown="if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();state.approvalTab='${key==='sgrade'?'lowprice':'sgrade'}';render();document.getElementById('approval-tab-'+state.approvalTab).focus()}">${label}<span class="tag ${n?'amber':'gray'}" style="margin-left:6px">待审 ${n}</span></button>`).join('')}</div></div><div id="approval-panel" role="tabpanel" aria-labelledby="approval-tab-${active}">${active==='sgrade'?sApprovalPage():sOldApproval()}</div>`;
};
NAV.find(n=>n.k==='approval').badge=()=>APPROVALS.filter(a=>a.status==='待审').length+S_APPS.filter(a=>a.status==='待审').length;
window.sReview=(id,kind)=>{const a=S_APPS.find(a=>a.id===id);if(!a||a.status!=='待审')return toast('该申请已处理');openModal({title:`运营S级${kind==='pass'?'通过':'驳回'} · ${a.id}`,body:`<div class="note warn">${esc(a.store)} / ${a.spu}：${esc(a.old||'未评级')} → S。${kind==='pass'?'通过后S级作为有效运营评级参与页面计算，正式结果待后续跑批。':'驳回后保留原有效评级。'}</div><div class="frm"><span>审批人（必填）</span><input id="s-who" placeholder="填写审批人姓名"><span>${kind==='reject'?'驳回原因（必填）':'审批意见（选填）'}</span><textarea id="s-reason"></textarea></div>`,footer:`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="sApprove('${id}','${kind}')">确认${kind==='pass'?'通过':'驳回'}</button>`})};
window.sApprove=(id,kind)=>{const a=S_APPS.find(a=>a.id===id);if(!a||a.status!=='待审')return toast('该申请已处理');const who=$('#s-who').value.trim(),reason=$('#s-reason').value.trim();if(!who)return toast('请填写审批人');if(kind==='reject'&&!reason)return toast('请填写驳回原因');const p=PARENTS.find(p=>sKey(p)===a.key);if(!p||sPending(p)!==a)return toast('申请已失效，请刷新核对');a.status=kind==='pass'?'已通过':'已驳回';a.who=who;a.reason=reason;a.handled=sTime();if(kind==='pass'){S_EFFECTIVE.set(a.key,'S');p.owner='S';LIGHT.pending=true}else{p.owner=a.old||'';S_EFFECTIVE.set(a.key,p.owner)}compute();lightRecord(`${a.store} / ${a.spu} S级申请${a.status}，审批人 ${who}`,reason);closeModal();render();toast(kind==='pass'?'S级审批已通过，页面已重算；正式结果待跑批':'已驳回，保留原有效评级')};
const sRender=render;render=function(){sRender();if(state.route==='import'){document.querySelectorAll('input[data-f="owner"]').forEach(el=>{const p=PARENTS.find(p=>p.id===el.dataset.p),a=S_APPS.find(a=>a.key===sKey(p)&&['待审','已驳回'].includes(a.status));el.setAttribute('placeholder','无历史评级');if(a&&ratingNorm(p.owner)!=='S')el.insertAdjacentHTML('afterend','<div style="margin-top:4px"><span class="tag amber">申请S · '+a.status+'</span><br><span class="muted">计算沿用上次评级：'+esc(p.owner||'缺失，待补充')+'</span></div>')})}};
compute();render();

 const dataCard=[...t.querySelectorAll(':scope > .card')].find(el=>el.querySelector('table'));
 if(dataCard){dataCard.classList.add('purchase-data');const bar=dataCard.querySelector(':scope > .fbar');if(bar){bar.classList.remove('fbar');bar.classList.add('card-h');const lab=bar.querySelector('.lab');if(lab)lab.outerHTML='<span>'+lab.textContent+'</span><div class="sp"></div>'}}
 const meta={spu:{label:'SPU 款式',count:PARENTS.length,unit:'款',sub:'款式政策字段 · 运营评级、财务评级与价格资料'},skc:{label:'SKC 颜色',count:PURCHASE_SHEET_DATA.skc.rows.length,unit:'条样本',sub:'店铺 × 颜色编码 · 价格、采购建议及退货率依据'},sku:{label:'SKU 明细',count:PURCHASE_SHEET_DATA.sku.rows.length,unit:'条样本',sub:'店铺 × SKU · 价格评级、采购建议及目标价计算依据'}};
 const notice=spu?'当前为原型演示 SPU 数据，可编辑运营评级与财务评级；S级需审批通过。颜色与SKU页签展示上传Excel的真实样本，两类数据未合并。':`来源：${esc(PURCHASE_SHEET_DATA[k].sheet)} · 已载入 ${PURCHASE_SHEET_DATA[k].rows.length} 条真实样本，并非全量导入（Sheet标注 ${PURCHASE_SHEET_DATA[k].sheetRows.toLocaleString()} 行）。不与演示SPU合并、不参与补货计算。`;
 return `<div class="card purchase-shell"><div class="card-h">采购计算 <span class="sub">分层查看商品资料与采购依据</span><div class="sp"></div><span class="hdr-chip">数据日 <b>${META.dataDate}</b></span></div><div class="cfg-tabs" role="tablist" aria-label="采购计算层级">${Object.entries(meta).map(([id,m])=>`<button class="cfg-tab ${id===k?'on':''}" role="tab" aria-selected="${id===k}" aria-controls="purchase-content" onclick="state.impTab='${id}';render()"><span class="cfg-no">${id.toUpperCase()}</span>${m.label}<span style="font-weight:400;color:var(--text-3);font-size:12px">${m.count} ${m.unit}</span></button>`).join('')}</div><div class="cfg-sub">${meta[k].sub}</div></div><div class="note info purchase-source"><span class="ic">i</span><span>${notice}</span></div><div id="purchase-content" role="tabpanel">${t.innerHTML}</div>`;
};
render();
</script>


<script>
window.actSku=(sku,kind)=>{const x=skuFind(sku);if(!x)return toast('未找到该 SKU');const old=skuDecisionRecord(x),qty=kind==='qty';window.__skuAction={key:skuDecisionKey(x),sku,kind};openModal({title:`${qty?'改量':kind==='reject'?'拒绝':'采纳'} · SKU ${sku}`,body:`<div class="note info">${esc(x.parent.store)} / ${esc(x.title)}<br>仅影响当前 SKU <b>${sku}</b>，同父体其他规格独立处理。</div><div class="frm"><span>当前 SKU 状态</span><b>${skuDecisionStatus(x)}</b><span>SKU 系统净缺口</span><b>${fmt(x.Q,1)} 件</b><span>原人工决定量</span><b>${old?old.qty+' 件':'未录入'}</b>${qty?`<span>本次 SKU 累计总量</span><input id="m-qty" type="number" min="0" step="1" value="${old?.qty??Math.max(0,Math.ceil(x.Q))}">`:`<span>本次人工决定量</span><b>${kind==='reject'?0:Math.max(0,Math.ceil(x.Q))} 件</b>`}<span>${kind==='adopt'?'原因（选填）':'原因（必填）'}</span><textarea id="m-note" placeholder="填写当前 SKU 的处理依据"></textarea></div><div class="muted">${qty?'重复录入覆盖本 SKU 原累计量，不追加；不修改系统建议量。':''}保存人工决定不代表已向供应商下单。记录仅保留当前打开期间。</div>`,footer:'<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="skuSubmitDecision()">核对并保存</button>'})};
window.skuSubmitDecision=()=>{const a=window.__skuAction,x=skuFind(a.sku),reason=$('#m-note').value.trim(),raw=a.kind==='qty'?$('#m-qty').value.trim():null;const qty=a.kind==='qty'?Number(raw):a.kind==='reject'?0:Math.max(0,Math.ceil(x.Q));if(a.kind!=='adopt'&&!reason)return toast('请填写调整或拒绝原因');if(a.kind==='qty'&&(raw===''||!Number.isInteger(qty)||qty<0))return toast('SKU采购量须为非负整数');window.__skuCandidate={...a,qty,reason};const old=skuDecisionRecord(x);if(a.kind==='qty'&&old){openModal({title:'确认覆盖当前 SKU 记录',body:`SKU <b>${a.sku}</b>：${old.qty} 件 → <b>${qty} 件</b>。仅覆盖该 SKU 的累计量，不追加，不影响其他 SKU。`,footer:'<button class="btn" onclick="window.__skuCandidate=null;closeModal()">取消覆盖</button><button class="btn primary" onclick="skuCommitDecision()">确认覆盖</button>'});return}skuCommitDecision()};
window.skuCommitDecision=()=>{const a=window.__skuCandidate;if(!a)return;const x=skuFind(a.sku);if(!x||skuDecisionKey(x)!==a.key)return toast('SKU已变化，请重新操作');const old=skuDecisionRecord(x),status=a.kind==='qty'?'已改量':a.kind==='reject'?'已拒绝':'已采纳';SKU_DECISIONS.set(a.key,{status,qty:a.qty,reason:a.reason,time:new Date().toLocaleString('zh-CN'),batch:META.latestBatch});lightRecord(`SKU ${a.sku}（${x.parent.store}）${status}：${old?.qty??'未录入'} → ${a.qty} 件`,a.reason);window.__skuCandidate=null;closeModal();render();toast(`SKU ${a.sku} ${status} ${a.qty} 件；其他SKU不受影响`)};
window.saveQty=()=>skuSubmitDecision();
// Legacy parent-detail actions first require choosing a specific SKU.
const skuParentAct=act;
window.act=(id,kind)=>{if(!['adopt','qty','reject'].includes(kind))return skuParentAct(id,kind);const p=PARENTS.find(p=>p.id===id);if(!p)return;openModal({title:'选择要处理的 SKU',body:`<div class="note info">采纳、改量、拒绝均按 SKU 独立记录，请选择具体规格。</div><select id="decision-sku">${p.skus.map(s=>`<option value="${s.sku}">${s.sku} · ${esc(s.color)} / ${esc(s.size)}</option>`).join('')}</select>`,footer:`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="actSku(document.getElementById('decision-sku').value,'${kind}')">继续</button>`})};
window.saveQtyParent=id=>act(id,'qty');
NAV.find(n=>n.k==='suggestions').badge=()=>PARENTS.flatMap(p=>p.skus.map(s=>({...s,parent:p}))).filter(x=>skuDecisionStatus(x)==='待处理').length;
render();
</script>

<script>
function lockSuggestionColumns(){const table=document.querySelector('.tb.sku');if(!table)return;const rows=[...table.rows],headers=[...rows[0].cells],start=headers.findIndex(c=>c.textContent.trim()==='补货数量');if(start<0)return;let right=0;for(let i=headers.length-1;i>=start;i--){const label=headers[i].textContent.trim();rows.forEach(row=>{const cell=row.cells[i];cell.classList.add('sku-locked');if(label==='状态')cell.classList.add('lock-status');if(label==='操作')cell.classList.add('lock-actions')});const width=headers[i].getBoundingClientRect().width;rows.forEach(row=>row.cells[i].style.right=right+'px');right+=width}}
const skuLockRender=render;render=function(){skuLockRender();lockSuggestionColumns()};window.addEventListener('resize',lockSuggestionColumns);
render();
</script>


<style>
.purchase-query{padding:14px;background:#fff}
.purchase-query-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px 18px}
.purchase-query label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
.purchase-query label>span{width:76px;flex:none}
.purchase-query input,.purchase-query select{width:100%;min-width:0;height:30px;border:1px solid var(--line-2);border-radius:6px;padding:0 8px;background:#fff;font-size:12px}
.purchase-query-foot{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
@media(max-width:1200px){.purchase-query-grid{grid-template-columns:repeat(3,minmax(150px,1fr))}}@media(max-width:900px){.purchase-query-grid{grid-template-columns:repeat(2,minmax(140px,1fr))}}
</style>
<script>
var PURCHASE_QUERY={spu:{},skc:{},sku:{}};
function pqSelect(key,label,items,value){return `<label><span>${label}</span><select name="${key}"><option value="">全部</option>${items.map(item=>{const [v,t]=Array.isArray(item)?item:[item,item];return `<option value="${esc(v)}" ${value===v?'selected':''}>${esc(t)}</option>`}).join('')}</select></label>`}
function pqInput(key,label,value,placeholder='',type='text'){return `<label><span>${label}</span><input name="${key}" type="${type}" ${type==='number'?'min="0" step="0.1"':''} value="${esc(value??'')}" placeholder="${placeholder}"></label>`}
function purchaseQueryForm(k){const q=PURCHASE_QUERY[k],rows=k==='spu'?PARENTS:PURCHASE_SHEET_DATA[k].rows,stores=[...new Set(rows.map(r=>k==='spu'?r.store:r.values[0]))],people=key=>[...new Set(rows.map(r=>r[key]).filter(Boolean))];let extra='';if(k==='spu'){extra=pqSelect('owner','运营评级',FINANCE_GRADES,q.owner)+pqSelect('finance','财务评级',[...FINANCE_GRADES,['__none__','未填写']],q.finance)+pqSelect('season','季节',['夏款','春秋款','冬款','四季'],q.season)+pqSelect('approval','S级审批',[['待审','待审批'],['已通过','已通过'],['已驳回','已驳回'],['已撤回','已撤回'],['none','无申请']],q.approval)}else{const advice=[...new Set(rows.map(r=>String(r.values[k==='sku'?6:5])).filter(Boolean))];extra=pqSelect('advice','采购建议',advice,q.advice)}if(k!=='skc')extra+=pqSelect('priceGrade','价格评级',['S','A','B','C','D','E'],q.priceGrade);extra+=pqSelect('priceState','价格数据',[['valid','价格资料完整'],['missing','缺失/无适用/错误']],q.priceState)+pqInput('ratioMin','价比下限%',q.ratioMin,'不限','number')+pqInput('ratioMax','价比上限%',q.ratioMax,'不限','number');return `<form class="card purchase-query" id="purchase-query" onsubmit="event.preventDefault();purchaseQueryApply('${k}')"><div class="purchase-query-grid">${pqSelect('pmc','PMC人员',[...people('pmcPerson'),['__none__','未分配']],q.pmc)}${pqSelect('store','店铺名称',stores,q.store)}${pqSelect('operator','运营人员',[...people('operatorPerson'),['__none__','未分配']],q.operator)}${pqInput('kw',k==='spu'?'款号/款式':k==='skc'?'颜色编码':'SKU/所属大类',q.kw,'请输入关键字')}${extra}</div><div class="purchase-query-foot"><button type="submit" class="btn sm primary">查询</button><button type="button" class="btn sm" onclick="purchaseQueryReset('${k}')">重置</button><span class="muted" style="font-size:12px">条件按当前Tab独立保留；现有数据未提供PMC及运营人员归属，暂显示“未分配”，接入归属后可按人员查询。</span></div></form>`}
window.purchaseQueryApply=k=>{const values=Object.fromEntries(new FormData(document.getElementById('purchase-query')));values.kw=values.kw.trim();if(values.ratioMin!==''&&values.ratioMax!==''&&Number(values.ratioMin)>Number(values.ratioMax))return toast('价比下限不能大于上限');PURCHASE_QUERY[k]=values;if(k==='spu')state.impKw.spu='';else{PS_VIEW[k].kw='';PS_VIEW[k].store='';PS_VIEW[k].page=1}render()};
window.purchaseQueryReset=k=>{PURCHASE_QUERY[k]={};if(k==='spu')state.impKw.spu='';else{PS_VIEW[k].kw='';PS_VIEW[k].store='';PS_VIEW[k].page=1}render()};
const pqRows=psRows;psRows=k=>pqRows(k).filter(r=>purchaseQueryMatch(k,r));
const pqImport=PAGES.import;PAGES.import=()=>{const k=state.impTab||'spu',el=document.createElement('div');el.innerHTML=pqImport();const shell=el.querySelector('.purchase-shell');shell.insertAdjacentHTML('afterend',purchaseQueryForm(k));const bar=el.querySelector('.purchase-data>.card-h');if(bar){bar.querySelectorAll('input:not([type=checkbox]),select').forEach(n=>n.remove());bar.querySelectorAll('button').forEach(n=>{if(['查询','重置'].includes(n.textContent.trim()))n.remove()})}const table=el.querySelector('.purchase-data table');if(k==='spu'&&table&&table.rows.length===1){const tr=table.insertRow();const td=tr.insertCell();td.colSpan=table.rows[0].cells.length;td.className='ph';td.textContent='没有符合条件的商品，请调整查询条件。'}return el.innerHTML};
render();
</script>
